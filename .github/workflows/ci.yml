name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests with Testcontainers PostgreSQL 18
        run: pnpm test:integration --maxWorkers 2
      - name: Browser tests with Fake AI and Testcontainers PostgreSQL 18
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          google-chrome --version
          pnpm test:e2e --workers 1
